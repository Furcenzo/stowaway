# Settings of this app for the mac-app-kit scripts in scripts/ (zsh syntax; defaults in scripts/app-config.sh).
APP_NAME="MenuBarLab"                  # name of the .app
EXECUTABLE="MenuBarLab"              # Swift executable target, Sources/MenuBarLab
BUNDLE_ID="io.github.furcenzo.menubarlab"
GITHUB_REPO="Furcenzo/menubarlab"
CASK="menubarlab"                          # Casks/menubarlab.rb in Furcenzo/homebrew-tap (add the cask before the first release)
SITE_SLUG=""                             # name for dev.furian.sk's update-site.sh, once the site shows the app
CATEGORY="public.app-category.utilities"
MIN_MACOS="27.0"
AGENT_APP=1                              # 1 = menu bar only, no Dock icon
DEV_CHANNEL=1                            # development builds are "MenuBarLab Dev" (io.github.furcenzo.menubarlab.dev)
