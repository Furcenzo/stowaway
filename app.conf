# Settings of this app for the mac-app-kit scripts in scripts/ (zsh syntax; defaults in scripts/app-config.sh).
APP_NAME="Stowaway"                  # name of the .app
EXECUTABLE="Stowaway"              # Swift executable target, Sources/Stowaway
BUNDLE_ID="io.github.furcenzo.stowaway"
GITHUB_REPO="Furcenzo/stowaway"
CASK="stowaway"                          # Casks/stowaway.rb in Furcenzo/homebrew-tap (add the cask before the first release)
SITE_SLUG="stowaway"                           # name for dev.furian.sk's update-site.sh, once the site shows the app
CATEGORY="public.app-category.utilities"
MIN_MACOS="27.0"
AGENT_APP=1                              # 1 = menu bar only, no Dock icon
DEV_CHANNEL=1                            # development builds are "Stowaway Dev" (io.github.furcenzo.stowaway.dev)
